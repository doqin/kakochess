<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kakochess - Guest Mode</title>
    <!-- Include jQuery and Chessboard.js CSS -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>Kakochess</h1>
        <p class="subtitle">Play against the AI Model</p>
        <div class="mode-badge guest-badge">Guest Mode</div>
      </header>
      
      <div class="game-area">
        <div id="status" class="status-panel">White to move</div>
        
        <div class="board-container">
          <div id="myBoard"></div>
        </div>
        
        <div class="controls">
          <button id="startBtn">Restart Game</button>
          <button id="switchBtn" style="background:#64748b;">Switch Sides</button>
        </div>

        <!-- Bot Settings -->
        <details id="botSettingsPanel" style="margin-top: 16px; width: 100%; max-width: 480px;">
          <summary style="cursor:pointer; font-size:0.85rem; font-weight:700; color: var(--text-secondary); user-select:none; padding: 6px 0;">
            ⚙️ Bot Settings
          </summary>
          <div id="bot-settings-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-top:12px; padding:14px; background:rgba(255,255,255,0.04); border-radius:10px; border:1px solid rgba(255,255,255,0.08);">

            <div class="setting-row">
              <label class="setting-label" for="mctsSims" title="Number of MCTS simulations per move. More = stronger but slower. (default: 50)">
                🔍 Simulations
              </label>
              <input type="number" id="mctsSims" class="styled-input setting-input" value="50" min="5" max="500" step="5" />
            </div>

            <div class="setting-row">
              <label class="setting-label" for="cpuct" title="Exploration constant C_puct. Higher = more exploration, lower = more exploitation. (default: 1.5)">
                🌡️ C_puct
              </label>
              <input type="number" id="cpuct" class="styled-input setting-input" value="1.5" min="0.1" max="5.0" step="0.1" />
            </div>

            <div class="setting-row">
              <label class="setting-label" for="tempThreshold" title="Move number to switch from exploratory (temp=1) to greedy/optimal (temp=0) play. (default: 30)">
                🎯 Temp. cutoff
              </label>
              <input type="number" id="tempThreshold" class="styled-input setting-input" value="30" min="0" max="80" step="1" />
            </div>

            <div class="setting-row">
              <label class="setting-label" for="dirichletEps" title="Dirichlet noise epsilon at root (0 = no noise / pure policy, 0.25 = standard AlphaZero). (default: 0.25)">
                🎲 Dirichlet ε
              </label>
              <input type="number" id="dirichletEps" class="styled-input setting-input" value="0.25" min="0" max="1" step="0.05" />
            </div>

          </div>
          <p style="font-size:0.72rem; color:var(--text-secondary); margin-top:6px; opacity:0.6; text-align:center;">
            Changes apply on the next bot move. Hover labels for info.
          </p>
        </details>

      </div>
      
      <div class="links">
        <a href="/admin.html">Switch to Admin Mode (Train Bot)</a>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- We bundle via Vite or just load type module -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
